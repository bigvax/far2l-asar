[ASAR]
TypeName=Electron ASAR Archive
Extension=asar
ID=04 00 00 00
IDPos=0
IDOnly=0
List="$HOME/.local/bin/far2l-asar" list %%AQ
Format0="a zzzzzzzzzzzzzzzzzzzz "
Extract="$HOME/.local/bin/far2l-asar" extract %%AQ --list %%LNS --root=%%R
ExtractWithoutPath="$HOME/.local/bin/far2l-asar" extract %%AQ --list %%LNS --root=%%R --flat
Test=
Delete=
Add="$HOME/.local/bin/far2l-asar" add %%AQ --list %%LNS --root=%%R
AddRecurse="$HOME/.local/bin/far2l-asar" add %%AQ --list %%LNS --root=%%R
Move=
MoveRecurse=
AllFilesMask=*
